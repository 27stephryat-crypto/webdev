        <main>
            <h2>Join Alumni Mailing List</h2>
            <h3>Request Alumni Newsletter</h3>
            <p>Required information is marked with an asterisk (*).</p>
            <form action="https://kearl.net/se1400/mail.php" method="post">
                <label for="fname">* First name: </label>
                <input type="text" required id="fname" name="myFName">

                <label for="lname">* Last name:</label>
                <input type="text" required id="lname" name="myLName">

                <label for="email">* E-mail:</label>
                <input type="email" required id="email" name="myEmail">

                <label for="phone">Phone:</label>
                <input type="tel" id="phone" name="myPhone">

                <label for="comments">Graduation Date:</label>
                <input type="date" name="graduationdate">

                <label for="comments">* Comments:</label>
                <textarea id="comments" required name="myComments" rows="2" cols="20"></textarea>

                <input type="submit" id="mySubmit" name="mySubmit">
            </form>
        </main>
