<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="robots" content="noindex, nofollow">
    <title>Page Title</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="wrapper">
        <main>
            <form action="https://kearl.net/se1400/mail.php" method="post">
                <label for="fname">* First name: </label>
                <input type="text" required="require" id="fname" name="myFName">

                <label for="lname">* Last name:</label>
                <input type="text" required="require" id="lname" name="myLName">

                <label for="email">* E-mail:</label>
                <input type="email" required="require" id="email" name="myEmail">

                <label for="phone">Phone:</label>
                <input type="tel" id="phone" name="myPhone">

                <label for="comments">Graduation Date:</label>
                <input type="date" name="graduationdate">

                <label for="comments">* Comments:</label>
                <textarea id="comments" required="require" name="myComments" rows="2" cols="20"></textarea>

                <input type="submit" id="mySubmit" name="mySubmit">
            </form>
        </main>
    </div>
</body>
